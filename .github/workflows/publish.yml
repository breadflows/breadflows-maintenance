name: Refresh catalogue and publish

on:
  push:
    branches: [main]
    paths:
      - 'pages-app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'media/**'
      - 'package*.json'
      - '*config*'
      - 'CNAME'
      - 'favicon.svg'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: breadflows-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      provider_errors: ${{ steps.sync.outputs.provider_errors }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Test importer without network or publication
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check public releases
        id: sync
        if: github.event_name != 'push'
        run: python scripts/sync_catalog.py
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Save verified catalogue updates
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add pages-app/src/lib/catalog.json scripts/catalog-sync-state.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public release catalogue'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report unavailable providers after preserving the working site
        if: needs.build.outputs.provider_errors == 'true'
        run: |
          echo 'A provider could not be refreshed. The cached catalogue was preserved; see scripts/catalog-sync-state.json and the sync log.' >&2
          exit 1
